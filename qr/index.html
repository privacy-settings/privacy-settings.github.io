<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code Generator</title>
    <!-- Core functional library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet"> 
    <style> 
        body {
            font-family: 'Google Sans', sans-serif;
        } 
        /* Hide actions section until a QR code is generated */
        .qr-actions {
            display: none;
            margin-top: 15px;
        }
        .qr-actions button {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <h1>QR Code Generator</h1>
    
    <label for="text-input">Input:</label>
    <input type="text" id="text-input" placeholder="https://example.com">
    <button id="generate-btn">Generate</button>

    <br><br>

    <div id="qrcode">QR Code here</div>
    
    <!-- Grouped the action controls under a wrapper -->
    <div class="qr-actions" id="actions-container">
        <button id="copy-btn">Copy QR Code</button>
        <button id="download-btn">Download QR Code</button>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const qrContainer = document.getElementById('qrcode');
        const actionsContainer = document.getElementById('actions-container');
        const copyBtn = document.getElementById('copy-btn');
        const downloadBtn = document.getElementById('download-btn'); // Target download button

        generateBtn.addEventListener('click', () => {
            const inputValue = textInput.value.trim();

            if (!inputValue) {
                alert('Please enter text first.');
                return;
            }

            // Clears placeholder text or old codes
            qrContainer.innerHTML = '';
            actionsContainer.style.display = 'none'; 

            // Generates the new QR Code
            new QRCode(qrContainer, {
                text: inputValue,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // Reveal action options once rendering processes
            setTimeout(() => {
                const canvas = qrContainer.querySelector('canvas');
                if (canvas) {
                    actionsContainer.style.display = 'block'; 
                }
            }, 100);
        });

        // Copy functionality using local canvas context
        copyBtn.addEventListener('click', () => {
            const canvas = qrContainer.querySelector('canvas');
            if (!canvas) return;

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => copyBtn.textContent = originalText, 2000);
                } catch (err) {
                    console.error(err);
                    alert('Could not copy image.');
                }
            }, 'image/png');
        });

        // Download functionality
        downloadBtn.addEventListener('click', () => {
            // Find the image element generated inside the container
            const qrImg = qrContainer.querySelector('img');
            
            if (!qrImg || !qrImg.src) {
                alert('No QR code available to download.');
                return;
            }

            // Create a temporary anchor link element
            const downloadLink = document.createElement('a');
            
            // Assign the base64 image data URI string to the link target
            downloadLink.href = qrImg.src;
            
            // Explicitly force the download behavior and specify the default filename
            downloadLink.download = 'qrcode.png';
            
            // Trigger the download by firing a script click event
            downloadLink.click();
        });
    </script>
    <br><br>
    <a href="/index.html">Homepage</a>
</body>
</html>
