<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code Generator</title>
    <!-- Core functional library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet"> 
    <style> 
        body {
            font-family: 'Google Sans', sans-serif;
        } 
        /* Initially hide the copy button until a QR code exists */
        #copy-btn {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>QR Code Generator</h1>
    
    <label for="text-input">Input:</label>
    <input type="text" id="text-input" placeholder="https://example.com">
    <button id="generate-btn">Generate</button>

    <br><br>

    <div id="qrcode">QR Code here</div>
    <!-- Added the Copy button element -->
    <button id="copy-btn">Copy QR Code</button>

    <script>
        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const qrContainer = document.getElementById('qrcode');
        const copyBtn = document.getElementById('copy-btn'); // Target the copy button

        generateBtn.addEventListener('click', () => {
            const inputValue = textInput.value.trim();

            if (!inputValue) {
                alert('Please enter text first.');
                return;
            }

            // Clears placeholder text or old codes
            qrContainer.innerHTML = '';
            copyBtn.style.display = 'none'; // Hide button during new generation

            // Generates the new QR Code image
            new QRCode(qrContainer, {
                text: inputValue,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // qrcode.js requires a small delay to generate the img tag and populate the src
            setTimeout(() => {
                const qrImg = qrContainer.querySelector('img');
                if (qrImg && qrImg.src) {
                    copyBtn.style.display = 'inline-block'; // Reveal copy button
                }
            }, 100);
        });

        // Copy functionality
        copyBtn.addEventListener('click', async () => {
            const qrImg = qrContainer.querySelector('img');
            
            if (!qrImg || !qrImg.src) {
                alert('No QR code available to copy.');
                return;
            }

            try {
                // Fetch the data URI and convert it into a binary blob
                const response = await fetch(qrImg.src);
                const blob = await response.blob();

                // Write the image blob directly to the system clipboard
                await navigator.clipboard.write([
                    new ClipboardItem({
                        [blob.type]: blob
                    })
                ]);

                // Provide visual feedback
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);

            } catch (err) {
                console.error('Failed to copy image: ', err);
                alert('Failed to copy the QR Code. Your browser might not support copying images.');
            }
        });
    </script>
    <br><br>
    <a href="/index.html">Homepage</a>
</body>
</html>
