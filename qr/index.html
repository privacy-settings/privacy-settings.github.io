<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code Generator</title>
    <!-- Core functional library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://gstatic.com" crossorigin="">
    <link href="https://googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet"> 
    <style> 
        body {
            font-family: 'Google Sans', sans-serif;
        } 
        /* Hide copy button until a QR code is generated */
        #copy-btn {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>QR Code Generator</h1>
    
    <label for="text-input">Input:</label>
    <input type="text" id="text-input" placeholder="https://example.com">
    <button id="generate-btn">Generate</button>

    <br><br>

    <div id="qrcode">QR Code here</div>
    <button id="copy-btn">Copy QR Code</button>

    <script>
        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const qrContainer = document.getElementById('qrcode');
        const copyBtn = document.getElementById('copy-btn');

        generateBtn.addEventListener('click', () => {
            const inputValue = textInput.value.trim();

            if (!inputValue) {
                alert('Please enter text first.');
                return;
            }

            // Clears placeholder text or old codes
            qrContainer.innerHTML = '';
            copyBtn.style.display = 'none'; 

            // Generates the new QR Code
            new QRCode(qrContainer, {
                text: inputValue,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // Wait a brief moment for qrcode.js to draw the canvas/image
            setTimeout(() => {
                const canvas = qrContainer.querySelector('canvas');
                if (canvas) {
                    copyBtn.style.display = 'inline-block'; 
                }
            }, 100);
        });

        // Fixed Copy function using the local canvas element
        copyBtn.addEventListener('click', () => {
            const canvas = qrContainer.querySelector('canvas');
            
            if (!canvas) {
                alert('No QR code available to copy.');
                return;
            }

            // Convert canvas rendering directly to a binary PNG blob without fetch requests
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    alert('Failed to process the QR code image.');
                    return;
                }

                try {
                    // Write the blob object directly to the clipboard items index
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            'image/png': blob
                        })
                    ]);

                    // UI Success Feedback Indicator
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 2000);

                } catch (err) {
                    console.error('Clipboard write failed:', err);
                    alert('Clipboard access denied. Ensure this page is running over HTTPS and you have interacted with the document.');
                }
            }, 'image/png');
        });
    </script>
    <br><br>
    <a href="/index.html">Homepage</a>
</body>
</html>
