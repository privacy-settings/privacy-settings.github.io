<!DOCTYPE html>
<html> <head> <link rel="icon" type="image/x-icon" href="/favicon.ico"> <title>Delayed Clock - JARS Tools</title> <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet"> <style> body {
  font-family: 'Google Sans', sans-serif;
} 
#clock {
  font-size: 20rem; 
  margin: 0; }
</style> <script>
  function startClock() {
    setInterval(function() {
      // 1. Get the current actual time
      const currentTime = new Date();
      
      // 2. Get the delay value from the input box (default to 0 if empty)
      const delayInSeconds = parseFloat(document.getElementById('delayInput').value) || 0;
      const delayInMilliseconds = delayInSeconds * 1000;
      
      // 3. Subtract the user-defined delay
      const delayedTime = new Date(currentTime.getTime() - delayInMilliseconds);
      
      // 4. Format the hours, minutes, and seconds
      const hours = String(delayedTime.getHours()).padStart(2, '0');
      const minutes = String(delayedTime.getMinutes()).padStart(2, '0');
      const seconds = String(delayedTime.getSeconds()).padStart(2, '0');
      
      // 5. Update the text inside the HTML container
      document.getElementById('clock').textContent = hours + ':' + minutes + ':' + seconds;
    }, 1000);
  }
</script>

</head> <body onload="startClock()">

 <!-- Input field to adjust the delay dynamically -->
  <label for="delayInput">Set delay in seconds (36 seconds is the delay for Global Player. Negative numbers are in the future): </label>
  <input type="number" id="delayInput" value="36" step="1">

  <!-- The unstyled running clock display -->
  <div id="clock">00:00:00</div>

</body></html>
