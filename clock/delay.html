<!DOCTYPE html>
<html> <head> <link rel="icon" type="image/x-icon" href="/favicon.ico"> <title>Blank Clock (No Minutes) - JARS Tools</title> <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet"> <style> body {
  font-family: 'Google Sans', sans-serif;
} 
#clock {
  font-size: 20rem; 
  margin: 0; }
</style> <script>
  function startClock() {
    setInterval(function() {
      // 1. Get the current actual time
      const currentTime = new Date();
      
      // 2. Subtract 36 seconds (36,000 milliseconds)
      const delayedTime = new Date(currentTime.getTime() - 36000);
      
      // 3. Format the hours, minutes, and seconds to always show two digits
      const hours = String(delayedTime.getHours()).padStart(2, '0');
      const minutes = String(delayedTime.getMinutes()).padStart(2, '0');
      const seconds = String(delayedTime.getSeconds()).padStart(2, '0');
      
      // 4. Update the text inside the HTML container
      document.getElementById('clock').textContent = hours + ':' + minutes + ':' + seconds;
    }, 1000);
  }
</script> 
</head> <body onload="startClock()">

  <!-- This unstyled element will hold the running clock time -->
  <div id="clock">00:00:00</div>

</body></html>
