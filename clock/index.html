  font-family: 'Google Sans', sans-serif;
}

<body>

    <h1 id="clock">00:00:00</h1>

    <script>
        function updateClock() {
            // 1. Get the current system time
            var codeTime = new Date();
            var h = codeTime.getHours();
            var m = codeTime.getMinutes();
            var s = codeTime.getSeconds();

            // 2. Add a leading zero if any number is less than 10
            if (h < 10) { h = "0" + h; }
            if (m < 10) { m = "0" + m; }
            if (s < 10) { s = "0" + s; }

            // 3. Combine the numbers and update the page text
            document.getElementById("clock").innerText = h + ":" + m + ":" + s;
        }

        // Run the clock instantly on load
        updateClock();

        // Repeat the clock function every 1000 milliseconds (1 second)
        setInterval(updateClock, 1000);
    </script>
<br></br>
<h3>Based off of local system time</h3>
