<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" type="image/x-icon" href="/favicon.ico"><title>Calculator - JARS Tools</title> <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet"> <style> body {
  font-family: 'Google Sans', sans-serif;
} 
</style></head> 
<body> <h1>Simple Calculator</h1>

    <!-- Calculator Display -->
    <input type="text" id="display" readonly><br><br>

    <!-- Calculator Buttons -->
    <button onclick="clearDisplay()">C</button>
    <button onclick="appendValue('/')">/</button>
    <button onclick="appendValue('*')">*</button>
    <button onclick="appendValue('-')">-</button><br>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button onclick="appendValue('+')">+</button><br>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button><br>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button onclick="calculate()">=</button><br>

    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button><br>

    <script>
        const display = document.getElementById('display');

        function appendValue(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                // Safely evaluates the mathematical expression in the display
                display.value = Function('"use strict";return (' + display.value + ')')();
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script> <a href="/index.html">Homepage</a></h3></body>
</html>
