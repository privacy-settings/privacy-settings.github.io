<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" type="image/x-icon" href="/favicon.ico"><title>Calculator - JARS Tools</title> <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet"> <style> body {
  font-family: 'Google Sans', sans-serif;
} 
</style></head> 
<body> <h1>Simple Calculator</h1>
    
    <label for="text-input">Input:</label>
    <input type="text" id="text-input" placeholder="https://example.com">
    <button id="generate-btn">Generate</button>

    <br><br>
    
    <div id="qrcode">QR Code here</div>
    
    <br>
    
    <!-- Action buttons (Hidden using a standard inline style until code is generated) -->
    <div id="actions" style="display: none;">
        <button id="download-btn">💾(Save)</button>
        <button id="copy-btn">📋(Copy)</button>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const qrContainer = document.getElementById('qrcode');
        const actionsDiv = document.getElementById('actions');
        const downloadBtn = document.getElementById('download-btn');
        const copyBtn = document.getElementById('copy-btn');

        generateBtn.addEventListener('click', () => {
            const inputValue = textInput.value.trim();

            if (!inputValue) {
                alert('Please enter text first.');
                return;
            }

            // Clears placeholder text or old codes
            qrContainer.innerHTML = '';

            // Generates the new QR Code image
            new QRCode(qrContainer, {
                text: inputValue,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // Reveal action buttons once the rendering completes
            setTimeout(() => {
                actionsDiv.style.display = 'block';
            }, 100);
        });

        // --- DOWNLOAD FUNCTIONALITY ---
        downloadBtn.addEventListener('click', () => {
            const img = qrContainer.querySelector('img');
            if (!img || !img.src) {
                alert('Error processing image. Please try again.');
                return;
            }

            const link = document.createElement('a');
            link.href = img.src;
            link.download = 'qrcode.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // --- COPY FUNCTIONALITY ---
        copyBtn.addEventListener('click', async () => {
            const canvas = qrContainer.querySelector('canvas');
            if (!canvas) {
                alert('Error: trouble processing canvas element');
                return;
            }

            try {
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert('Error: Could not process image copy data.');
                        return;
                    }
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    
                    const originalText = copyBtn.innerText;
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
                });
            } catch (err) {
                console.error(err);
                alert('Browser blocked quick copying. Try right-clicking the image instead!');
            }
        });
    </script>
 <a href="/index.html">Homepage</a></h3></body>
</html>
