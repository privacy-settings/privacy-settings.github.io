<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" type="image/x-icon" href="/favicon.ico"><title>Calculator - JARS Tools</title> <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&amp;family=Open+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet"> <style> body {
  font-family: 'Google Sans', sans-serif;
} 
</style></head> 
<body> <h1>Simple Calculator</h1>
    
    <!-- Calculator Display -->
    <input type="text" id="display" readonly>
    <br><br>

    <!-- Calculator Grid Layout using a Standard HTML Table -->
    <table>
        <tr>
            <td><button onclick="clearDisplay()">C</button></td>
            <td><button onclick="appendValue('/')">/</button></td>
            <td><button onclick="appendValue('*')">*</button></td>
            <td><button onclick="appendValue('-')">-</button></td>
        </tr>
        <tr>
            <td><button onclick="appendValue('7')">7</button></td>
            <td><button onclick="appendValue('8')">8</button></td>
            <td><button onclick="appendValue('9')">9</button></td>
            <td rowspan="2"><button onclick="appendValue('+')" style="height: 100%;">+</button></td>
        </tr>
        <tr>
            <td><button onclick="appendValue('4')">4</button></td>
            <td><button onclick="appendValue('5')">5</button></td>
            <td><button onclick="appendValue('6')">6</button></td>
        </tr>
        <tr>
            <td><button onclick="appendValue('1')">1</button></td>
            <td><button onclick="appendValue('2')">2</button></td>
            <td><button onclick="appendValue('3')">3</button></td>
            <td rowspan="2"><button onclick="calculate()" style="height: 100%;">=</button></td>
        </tr>
        <tr>
            <td colspan="2"><button onclick="appendValue('0')" style="width: 100%;">0</button></td>
            <td><button onclick="appendValue('.')">.</button></td>
        </tr>
    </table>

    <!-- JavaScript Functionality -->
    <script>
        const display = document.getElementById('display');

        function appendValue(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                // Evaluates the math string typed in the box safely
                if (display.value) {
                    display.value = Function('"use strict"; return (' + display.value + ')')();
                }
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>
 <a href="/index.html">Homepage</a></h3></body>
</html>
